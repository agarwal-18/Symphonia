<!DOCTYPE html>
<html>
<head>
    <title>Test Email - Symphonia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #0a0a0a;
            color: #fff;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #2a2a2a;
            background: #121212;
            color: #fff;
        }
        button {
            background: linear-gradient(135deg, #00d4ff 0%, #a855f7 100%);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background: #10b98120;
            border: 1px solid #10b981;
            color: #10b981;
        }
        .error {
            background: #ef444420;
            border: 1px solid #ef4444;
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Test Email Sending</h1>
        <p>Enter your email address and username to test the email service:</p>
        
        <input type="email" id="email" placeholder="your-email@gmail.com" />
        <input type="text" id="username" placeholder="testuser" />
        <button onclick="testEmail()">Send Test Email</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testEmail() {
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const resultDiv = document.getElementById('result');
            
            if (!email || !username) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Please enter both email and username';
                return;
            }
            
            resultDiv.className = 'result';
            resultDiv.innerHTML = 'Sending test email...';
            
            try {
                const response = await fetch('http://localhost:5000/api/verification/test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, username })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Success!</strong><br>
                        ${data.message}<br>
                        <small>Check your inbox at: ${data.email}</small>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Error:</strong><br>
                        ${data.message}<br>
                        ${data.error ? `<small>${data.error}</small>` : ''}
                        ${data.troubleshooting ? `
                            <br><strong>Help:</strong><br>
                            ${Object.entries(data.troubleshooting).map(([k, v]) => `${k}: ${v}`).join('<br>')}
                        ` : ''}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ Connection Error:</strong><br>
                    ${error.message}<br>
                    <small>Make sure the backend is running on port 5000</small>
                `;
            }
        }
    </script>
</body>
</html>
